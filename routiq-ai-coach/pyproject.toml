[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "routiq-ai-coach"
version = "0.1.0"
description = "Routiq AI Coach milestone 1 foundation (offline only)"
requires-python = ">=3.10,<3.14"
dependencies = [
  "crewai==1.15.27",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.11,<3",
  "openai>=1.83,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
notebook = ["ipykernel>=6,<8", "nbformat>=5,<6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.config" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
